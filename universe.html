<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Universe — On My Way</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#fff;color:#191919;font-family:Georgia,serif;overflow:hidden}a,button{color:inherit}a:focus-visible,button:focus-visible{outline:2px solid #111;outline-offset:4px}.top{position:absolute;z-index:5;top:28px;left:32px;right:32px;display:flex;align-items:center;justify-content:space-between}.back{font:11px Arial,sans-serif;letter-spacing:.06em;text-decoration:none}.brand{font:700 10px Arial,sans-serif;letter-spacing:.14em}.caption{position:absolute;z-index:3;bottom:30px;left:32px;pointer-events:none}.caption h1{font:italic 25px Georgia,serif;margin:0 0 5px}.caption p{font:10px Arial,sans-serif;letter-spacing:.03em;color:#777;margin:0}.graph{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}.graph.dragging{cursor:grabbing}.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.node{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:5px;border:0;padding:0;background:none;font:11px/1.1 Arial,sans-serif;white-space:nowrap;cursor:pointer;transform-origin:center center}.node .icon{display:grid;place-items:center;width:var(--size);height:var(--size);border:1px solid #262626;border-radius:50%;background:#fff;transition:background .16s,color .16s,box-shadow .16s}.node:hover .icon,.node:focus-visible .icon{background:#1b1b1b;color:#fff;box-shadow:0 0 0 5px #0000000a}.node svg{width:48%;height:48%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.node .name{max-width:140px;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 5px #fff,0 0 5px #fff,0 0 5px #fff}.node.featured .icon{border-width:1.5px}.node.featured .name{font-weight:bold}.overlay{position:fixed;z-index:10;inset:0;display:grid;place-items:center;padding:20px;background:#ffffffbb}.overlay[hidden]{display:none}.card{position:relative;width:min(390px,100%);max-height:min(520px,85vh);overflow:auto;background:#fff;border:1px solid #222;padding:36px;box-shadow:0 16px 45px #00000012}.close{position:absolute;right:14px;top:10px;background:none;border:0;font:28px Georgia,serif;cursor:pointer}.kind{font:10px Arial,sans-serif;letter-spacing:.15em;color:#777;text-transform:uppercase}.card h2{font:normal 30px/1.1 Georgia,serif;margin:12px 0 14px}.card p{font:14px/1.6 Arial,sans-serif;color:#555}.card h3{font:10px Arial,sans-serif;letter-spacing:.12em;margin:25px 0 12px;text-transform:uppercase}.card ul{list-style:none;padding:0;margin:0;font:13px/1.8 Arial,sans-serif}.card li{border-top:1px solid #eee;padding:7px 0}.card li span{display:block;color:#888;font-size:10px}.hint{position:absolute;bottom:30px;right:32px;font:10px Arial,sans-serif;color:#888;pointer-events:none}@media(max-width:600px){.top{top:22px;left:20px;right:20px}.caption{bottom:24px;left:20px}.caption h1{font-size:21px}.hint{bottom:25px;right:20px}.node{font-size:9px}.node .name{max-width:100px}.card{padding:30px}}
  </style>
</head>
<body>
  <header class="top"><a class="back" href="index.html">← ON MY WAY</a><span class="brand">MY UNIVERSE</span></header>
  <main id="graph" class="graph" aria-label="Interactive music universe. Drag to rotate, or use the arrow keys." tabindex="0"><svg id="edges" class="edges" aria-hidden="true"></svg></main>
  <div class="caption"><h1>My Universe</h1><p>Leaving New York · a playlist in connections</p></div>
  <div class="hint">DRAG TO EXPLORE</div>
  <div id="overlay" class="overlay" hidden><section class="card" role="dialog" aria-modal="true" aria-labelledby="detail-title"><button id="close" class="close" aria-label="Close details">×</button><div id="detail-kind" class="kind"></div><h2 id="detail-title"></h2><p id="detail-description"></p><h3>Connections</h3><ul id="detail-links"></ul></section></div>
  <script>
    const icons={song:'<path d="M9 18V5l10-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',artist:'<path d="m12 2 2.9 6 6.6 1-4.8 4.6 1.1 6.5-5.8-3.1-5.8 3.1 1.1-6.5L2.5 9l6.6-1z"/>',album:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><path d="M7 7a7 7 0 0 0-2 5M17 17a7 7 0 0 0 2-5"/>',place:'<path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',film:'<rect x="3" y="8" width="18" height="12" rx="1"/><path d="M3 8V5l17-3 1 4-18 2M8 4l3 3M15 3l3 3"/>'};
    // New York is the user's personal playlist association, not a claim about where the songs were made.
    const nodes=[
      {id:'ny',name:'New York',type:'place',featured:true,description:'The city connected to this personal autumn playlist.'},
      {id:'beatles',name:'The Beatles',type:'artist',featured:true,description:'An artist appearing twice in this playlist.'},
      {id:'mother',name:'Mother Nature’s Son',type:'song',description:'A song by The Beatles in the New York autumn playlist.'},
      {id:'across',name:'Across the Universe',type:'song',description:'A song by The Beatles in the New York autumn playlist.'},
      {id:'white',name:'The Beatles',type:'album',description:'The Beatles album, often called the White Album.'},
      {id:'letitbe',name:'Let It Be',type:'album',description:'The Beatles album containing Across the Universe.'},
      {id:'park',name:'Park Bird',type:'artist',description:'Artist of Moth.'},
      {id:'moth',name:'Moth',type:'song',description:'A song by Park Bird in the New York autumn playlist.'},
      {id:'fleet',name:'Fleet Foxes',type:'artist',description:'Artist of False Knight on the Road.'},
      {id:'knight',name:'False Knight on the Road',type:'song',description:'A song by Fleet Foxes in the New York autumn playlist.'},
      {id:'lomelda',name:'Lomelda',type:'artist',description:'Artist of Hannah Sun.'},
      {id:'hannah',name:'Hannah Sun',type:'song',description:'A song by Lomelda in the New York autumn playlist.'},
      {id:'hannahalbum',name:'Hannah',type:'album',description:'The album associated with Hannah Sun in the playlist.'},
      {id:'labi',name:'Labi Siffre',type:'artist',description:'Artist of Crying Laughing Loving Lying.'},
      {id:'crying',name:'Crying Laughing Loving Lying',type:'song',description:'A song by Labi Siffre in the New York autumn playlist.'},
      {id:'velvet',name:'The Velvet Underground',type:'artist',description:'Artist of After Hours.'},
      {id:'after',name:'After Hours',type:'song',description:'A song by The Velvet Underground in the New York autumn playlist.'}
    ];
    const links=[['ny','mother','In this New York playlist'],['ny','across','In this New York playlist'],['ny','moth','In this New York playlist'],['ny','knight','In this New York playlist'],['ny','hannah','In this New York playlist'],['ny','crying','In this New York playlist'],['ny','after','In this New York playlist'],['beatles','mother','Artist and song'],['beatles','across','Artist and song'],['beatles','white','Artist and album'],['beatles','letitbe','Artist and album'],['mother','white','Song and album'],['across','letitbe','Song and album'],['park','moth','Artist and song'],['fleet','knight','Artist and song'],['lomelda','hannah','Artist and song'],['hannah','hannahalbum','Song and album'],['lomelda','hannahalbum','Artist and album'],['labi','crying','Artist and song'],['velvet','after','Artist and song']];
    const graph=document.querySelector('#graph'),edges=document.querySelector('#edges'),overlay=document.querySelector('#overlay'),close=document.querySelector('#close');
    let yaw=.25,pitch=-.12,drag=null,lastFocus=null;const golden=Math.PI*(3-Math.sqrt(5));
    nodes.forEach((n,i)=>{const y=1-(i/(nodes.length-1))*2,r=Math.sqrt(1-y*y),angle=golden*i;n.pos={x:Math.cos(angle)*r,y,z:Math.sin(angle)*r};n.button=document.createElement('button');n.button.type='button';n.button.className='node'+(n.featured?' featured':'');n.button.setAttribute('aria-label',n.type+': '+n.name);n.button.innerHTML='<span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">'+icons[n.type]+'</svg></span><span class="name"></span>';n.button.querySelector('.name').textContent=n.name;n.button.addEventListener('click',()=>{if(!n.button.dataset.dragged)openDetail(n);delete n.button.dataset.dragged});graph.append(n.button)});
    function draw(){const w=graph.clientWidth,h=graph.clientHeight,radius=Math.min(w*.37,h*.39,390),cx=w/2,cy=h*.49,projected={};nodes.forEach(n=>{const p=n.pos,x=p.x*Math.cos(yaw)+p.z*Math.sin(yaw),z0=-p.x*Math.sin(yaw)+p.z*Math.cos(yaw),y=p.y*Math.cos(pitch)-z0*Math.sin(pitch),z=p.y*Math.sin(pitch)+z0*Math.cos(pitch),scale=.76+(z+1)*.19;const px=cx+x*radius*scale,py=cy-y*radius*scale,size=(n.featured?52:39)*scale;projected[n.id]={x:px,y:py,z};n.button.style.setProperty('--size',size+'px');n.button.style.transform='translate('+px+'px,'+py+'px) translate(-50%,-50%)';n.button.style.opacity=String(.48+(z+1)*.26);n.button.style.zIndex=String(Math.round((z+1)*100)+1)});edges.replaceChildren();links.forEach(([a,b])=>{const p=projected[a],q=projected[b],line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',p.x);line.setAttribute('y1',p.y);line.setAttribute('x2',q.x);line.setAttribute('y2',q.y);line.setAttribute('stroke','#b7b7b7');line.setAttribute('stroke-opacity',String(.25+(p.z+q.z+2)*.1));line.setAttribute('stroke-width','1');edges.append(line)})}
    function openDetail(node){lastFocus=document.activeElement;document.querySelector('#detail-kind').textContent=node.type==='place'?'City':node.type;document.querySelector('#detail-title').textContent=node.name;document.querySelector('#detail-description').textContent=node.description;const list=document.querySelector('#detail-links');list.replaceChildren();links.filter(l=>l[0]===node.id||l[1]===node.id).forEach(l=>{const other=nodes.find(n=>n.id===(l[0]===node.id?l[1]:l[0]));const li=document.createElement('li');li.textContent=other.name;const detail=document.createElement('span');detail.textContent=l[2]+' · '+other.type;li.append(detail);list.append(li)});overlay.hidden=false;close.focus()}
    function closeDetail(){overlay.hidden=true;if(lastFocus)lastFocus.focus()}close.addEventListener('click',closeDetail);overlay.addEventListener('click',e=>{if(e.target===overlay)closeDetail()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden)closeDetail()});
    graph.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,node:e.target.closest('.node'),moved:false};(drag.node||graph).setPointerCapture(e.pointerId)});
    graph.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>5){drag.moved=true;graph.classList.add('dragging')}if(drag.moved){yaw+=dx*.008;pitch=Math.max(-1.2,Math.min(1.2,pitch+dy*.008));draw()}drag.x=e.clientX;drag.y=e.clientY});
    graph.addEventListener('pointerup',e=>{if(!drag)return;if(drag.moved&&drag.node)drag.node.dataset.dragged='true';graph.classList.remove('dragging');drag=null});graph.addEventListener('pointercancel',()=>{drag=null;graph.classList.remove('dragging')});
    graph.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();if(e.key==='ArrowLeft')yaw-=.16;if(e.key==='ArrowRight')yaw+=.16;if(e.key==='ArrowUp')pitch=Math.max(-1.2,pitch-.16);if(e.key==='ArrowDown')pitch=Math.min(1.2,pitch+.16);draw()});window.addEventListener('resize',draw);draw();
  </script>
</body>
</html>
